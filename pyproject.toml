[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-langgraph-sre-agent"
version = "0.1.0"
description = "AWS SRE incident investigation agent built with LangGraph and Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "langchain-aws>=0.2.0",
  "bedrock-agentcore>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
